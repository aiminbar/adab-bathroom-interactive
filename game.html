<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ألعب وأطبق</title><link rel="stylesheet" href="style.css"></head><body><div class="header-wrap"><img src="header-game.png" alt="ألعب وأطبق"><button class="hotspot home-button" data-home aria-label="الرئيسية"></button></div><main class="page"><section class="panel"><h1 class="title">سَاعِدِي مِنَارَا</h1><p class="note">اِخْتَارِي التَّصَرُّفَ الصَّحِيحَ فِي كُلِّ مَحَطَّةٍ.</p><div id="game"></div></section></main><script src="app.js"></script><script>
const g=[['01-before-entry.png','قَبْلَ الدُّخُولِ','أَقُولُ الدُّعَاءَ','أَدْخُلُ دُونَ دُعَاءٍ'],['02-left-foot.png','عِنْدَ الدُّخُولِ','أَدْخُلُ بِقَدَمِي الْيُسْرَى','أَدْخُلُ بِقَدَمِي الْيُمْنَى'],['03-close-door.png','بَعْدَ الدُّخُولِ','أُغْلِقُ الْبَابَ خَلْفِي','أَتْرُكُ الْبَابَ مَفْتُوحًا'],['04-flush.png','بَعْدَ قَضَاءِ الْحَاجَةِ','أَضْغَطُ جِهَازَ الطَّرْدِ','أَتْرُكُ الْمَكَانَ كَمَا هُوَ'],['05-exit-right.png','عِنْدَ الْخُرُوجِ','أَخْرُجُ بِقَدَمِي الْيُمْنَى وَأَقُولُ: غُفْرَانَكَ','أَخْرُجُ بِقَدَمِي الْيُسْرَى'],['06-wash-hands.png','بَعْدَ الْخُرُوجِ','أَغْسِلُ يَدَيَّ بِالْمَاءِ وَالصَّابُونِ','لَا أَغْسِلُ يَدَيَّ']];let i=0,el=document.getElementById('game');function r(){if(i===g.length){el.innerHTML='<div class="result">⭐ أَحْسَنْتِ! سَاعَدْتِ مِنَارَا فِي الْمَحَطَّاتِ السِّتِّ.<div class="center"><a class="primary" href="assessment.html" style="text-decoration:none;display:inline-block;margin-top:18px">التَّقْوِيمُ الْخِتَامِيُّ</a></div></div>';return}let x=g[i];el.innerHTML=`<div class="scene-card"><img src="${x[0]}"><div class="scene-copy">الْمَحَطَّةُ ${i+1}: ${x[1]}</div></div><div class="answers"><button class="answer" data-answer="correct">${x[2]}</button><button class="answer" data-answer="wrong">${x[3]}</button></div><div class="center"><button class="primary hidden" data-next id="gn" style="margin-top:18px">الْمَحَطَّةُ التَّالِيَةُ</button></div>`;bindAnswers(el);document.getElementById('gn').onclick=()=>{i++;r()}}r();</script></body></html>
