<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أشاهد وأتعلم</title><link rel="stylesheet" href="style.css"></head><body><div class="header-wrap"><img src="header-watch-learn.png" alt="أشاهد وأتعلم"><button class="hotspot home-button" data-home aria-label="الرئيسية"></button></div><main class="page"><div class="progress" id="prog"></div><section id="scene"></section></main><script src="app.js"></script><script>
const scenes=[['01-dua.mp4','قَبْلَ الدُّخُولِ لِدَوْرَةِ الْمِيَاهِ أَقُولُ الدُّعَاءَ.','اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ.'],['02-left-foot.mp4','أَدْخُلُ بِقَدَمِي الْيُسْرَى.',''],['03-close-door.mp4','أُغْلِقُ الْبَابَ خَلْفِي.',''],['04-flush.mp4','أَضْغَطُ جِهَازَ الطَّرْدِ.',''],['05-exit-right.mp4','أَخْرُجُ بِقَدَمِي الْيُمْنَى وَأَقُولُ: غُفْرَانَكَ.',''],['06-wash-hands.mp4','أَغْسِلُ يَدَيَّ بِالْمَاءِ وَالصَّابُونِ.','']];let i=0;const prog=document.getElementById('prog'),box=document.getElementById('scene');function render(){prog.innerHTML=scenes.map((_,n)=>`<span class="dot ${n<i?'done':''}">${n<i?'✓':n+1}</span>`).join('');if(i>=scenes.length){box.innerHTML='<section class="panel result">أَحْسَنْتِ! تَعَلَّمْتِ آدَابَ اسْتِخْدَامِ دَوْرَةِ الْمِيَاهِ.<div class="center"><a class="primary" href="practice.html" style="text-decoration:none;display:inline-block;margin-top:18px">أَتَدَرَّبُ</a></div></section>';return}let s=scenes[i];box.innerHTML=`<article class="scene-card"><video controls playsinline preload="metadata"><source src="${s[0]}" type="video/mp4"></video><div class="scene-copy">${s[1]}${s[2]?`<br><span>${s[2]}</span>`:''}</div><div class="center" style="padding:0 0 22px"><button class="primary" id="learned">تَعَلَّمْتُهَا</button></div></article>`;document.getElementById('learned').onclick=()=>{i++;render()}}render();</script></body></html>
