<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التقويم الختامي</title><link rel="stylesheet" href="style.css"></head><body><div class="header-wrap"><img src="header-assessment.png" alt="التقويم الختامي"><button class="hotspot home-button" data-home aria-label="الرئيسية"></button></div><main class="page"><div class="progress" id="ap"></div><section class="panel"><div id="aq"></div></section></main><script src="app.js"></script><script>
const A=[['مَاذَا أَقُولُ قَبْلَ الدُّخُولِ لِدَوْرَةِ الْمِيَاهِ؟',['اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ','غُفْرَانَكَ','لَا أَقُولُ شَيْئًا'],0],['بِأَيِّ قَدَمٍ أَدْخُلُ دَوْرَةَ الْمِيَاهِ؟',['الْيُمْنَى','الْيُسْرَى'],1],['مَاذَا أَفْعَلُ بِالْبَابِ بَعْدَ الدُّخُولِ؟',['أَتْرُكُهُ مَفْتُوحًا','أُغْلِقُهُ خَلْفِي'],1],['مَاذَا أَفْعَلُ بَعْدَ قَضَاءِ الْحَاجَةِ؟',['أَضْغَطُ جِهَازَ الطَّرْدِ','أَتْرُكُ الْمَكَانَ كَمَا هُوَ'],0],['كَيْفَ أَخْرُجُ مِنْ دَوْرَةِ الْمِيَاهِ؟',['أَخْرُجُ بِقَدَمِي الْيُمْنَى وَأَقُولُ: غُفْرَانَكَ','أَخْرُجُ بِقَدَمِي الْيُسْرَى وَأَقُولُ: غُفْرَانَكَ','أَخْرُجُ بِقَدَمِي الْيُمْنَى وَلَا أَقُولُ شَيْئًا'],0],['مَاذَا أَفْعَلُ بَعْدَ الْخُرُوجِ؟',['أَمْسَحُ يَدَيَّ فَقَطْ','أَغْسِلُ يَدَيَّ بِالْمَاءِ وَالصَّابُونِ','لَا أَفْعَلُ شَيْئًا'],1]];let i=0,aq=document.getElementById('aq'),ap=document.getElementById('ap');function r(){ap.innerHTML=A.map((_,n)=>`<span class="dot ${n<i?'done':''}">${n<i?'✓':n+1}</span>`).join('');if(i===A.length){aq.innerHTML='<div class="result">أَحْسَنْتِ! أَتْمَمْتِ التَّقْوِيمَ بِنَجَاحٍ، وَتَعَلَّمْتِ آدَابَ اسْتِخْدَامِ دَوْرَةِ الْمِيَاهِ.<div class="center" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px"><button class="primary" id="again">أُعِيدُ التَّقْوِيمَ</button><a class="primary" href="index.html" style="text-decoration:none">الرَّئِيسِيَّةُ</a></div></div>';document.getElementById('again').onclick=()=>{i=0;r()};return}let x=A[i];aq.innerHTML=`<div class="question">${x[0]}</div><div class="answers">${x[1].map((a,k)=>`<button class="answer" data-answer="${k===x[2]?'correct':'wrong'}">${a}</button>`).join('')}</div><div class="center"><button class="primary hidden" data-next id="an" style="margin-top:20px">التَّالِي</button></div>`;bindAnswers(aq);document.getElementById('an').onclick=()=>{i++;r()}}r();</script></body></html>
